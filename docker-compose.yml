services:
  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs/cert.pem:/etc/nginx/ssl/cert.pem:ro
      - ./nginx/certs/key.pem:/etc/nginx/ssl/key.pem:ro
      - ./nginx/certs/issuer.pem:/etc/nginx/ssl/issuer.pem:ro
    networks:
      - todo-net
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build: ./backend
    networks:
      - todo-net
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-dev-secret-key-change-in-prod}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,backend,todo.pragmaticwoodworking.com,${DJANGO_ALLOWED_HOSTS:-}
      - CORS_ALLOWED_ORIGINS=https://localhost,${CORS_ALLOWED_ORIGINS:-}
      - FORCE_SCRIPT_NAME=/backend
    restart: unless-stopped

networks:
  todo-net:
    driver: bridge

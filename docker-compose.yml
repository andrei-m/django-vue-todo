services:
  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs/cert.pem:/etc/nginx/ssl/cert.pem:ro
      - ./nginx/certs/key.pem:/etc/nginx/ssl/key.pem:ro
      - ./nginx/certs/issuer.pem:/etc/nginx/ssl/issuer.pem:ro
    networks:
      - todo-net
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
        restart: true
      ui:
        condition: service_started
        restart: true

  ui:
    build: ./ui
    networks:
      - todo-net
    restart: unless-stopped

  backend:
    build: ./backend
    networks:
      - todo-net
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-dev-secret-key-change-in-prod}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,backend,${DJANGO_ALLOWED_HOSTS:-}
      - CORS_ALLOWED_ORIGINS=https://localhost,${CORS_ALLOWED_ORIGINS:-}
      - FORCE_SCRIPT_NAME=/backend
      - DATABASE_URL=postgres://${POSTGRES_USER:-todo_user}:${POSTGRES_PASSWORD:-todo_pass}@db:5432/${POSTGRES_DB:-todo_db}
    restart: unless-stopped
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    networks:
      - todo-net
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-todo_db}
      - POSTGRES_USER=${POSTGRES_USER:-todo_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-todo_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  todo-net:
    driver: bridge
